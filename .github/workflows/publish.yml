name: Publish

permissions:
  id-token: write
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v-prefixed numeric semver, for example v1.5.0."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          RELEASE_COMMIT="$(git rev-list -n 1 "$GITHUB_SHA")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release tag $GITHUB_REF_NAME points to $RELEASE_COMMIT, which is not reachable from origin/main."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Run lint
        run: bun run lint

      - name: Run tests
        env:
          CI: 'false'
        run: bun test

      - name: Build package
        run: bun run build

      - name: Verify package contents
        run: bun run package:check

      - name: Create release notes
        run: bun scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md

      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          NPM_VERSION="$(npm --version)"
          NPM_VERSION="$NPM_VERSION" node -e '
            const current = process.env.NPM_VERSION.split(".").map(Number);
            const minimum = [11, 5, 1];
            const ok = current.some((part, index) => part !== minimum[index])
              ? current.find((part, index) => part !== minimum[index]) >
                minimum[current.findIndex((part, index) => part !== minimum[index])]
              : true;
            if (!ok) {
              console.error(`npm ${process.env.NPM_VERSION} does not support trusted publishing. Use npm >= 11.5.1.`);
              process.exit(1);
            }
          '

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TITLE="$GITHUB_REF_NAME"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --verify-tag
          fi
